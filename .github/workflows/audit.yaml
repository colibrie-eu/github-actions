---
name: Audit

on:
  workflow_call:
    inputs:
      go-version:
        description: Go compiler used by audit jobs.
        type: string
        required: false
        default: "1.25"
      swag-version:
        description: Version of the Swagger formatter.
        type: string
        required: false
        default: latest
      staticcheck-version:
        description: Version of staticcheck.
        type: string
        required: false
        default: latest
      golangci-lint-version:
        description: Version of golangci-lint.
        type: string
        required: false
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: |
          go build -v ./...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

  govet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run go vet
        run: |
          go vet ./...

  swagfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      - name: Install swag
        env:
          AUDIT_SWAG_VERSION: ${{ inputs.swag-version }}
        run: go install "github.com/swaggo/swag/cmd/swag@${AUDIT_SWAG_VERSION}"

      - name: Run swag fmt
        run: |
          swag fmt
          if [ -n "$(git status --porcelain)" ]; then exit 1; fi

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      - name: Install staticcheck
        env:
          AUDIT_STATICCHECK_VERSION: ${{ inputs.staticcheck-version }}
        run: go install "honnef.co/go/tools/cmd/staticcheck@${AUDIT_STATICCHECK_VERSION}"

      - name: Run staticcheck
        run: |
          staticcheck ./...

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      - name: Install golangci-lint
        env:
          AUDIT_GOLANGCI_VERSION: ${{ inputs.golangci-lint-version }}
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${AUDIT_GOLANGCI_VERSION}"

      - name: Run golangci-lint
        run: |
          golangci-lint run

  gotest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run go test
        run: |
          go test -v ./...
